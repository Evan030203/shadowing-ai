name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 서명 키를 한 번 만들어 저장소에 넣어 둔다. 키가 매번 같아야 새 APK가 기존 앱 위에 설치된다.
      - name: Create signing key once
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -keystore app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShadowingAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowingAI
          path: ShadowingAI.apk

      # 폰에서 바로 받을 수 있게 'latest' 릴리스에 APK를 올린다.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShadowingAI.apk \
            --title "쉐도잉 AI (빌드 ${{ github.run_number }})" \
            --notes "폰에서 ShadowingAI.apk 를 눌러 받아 설치하세요."
